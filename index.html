<!doctype html>
<!-- 생성물 — 직접 수정 금지. web/tools/build.py (원본: web/src/) -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song of Songs</title>
<!-- 저장된 테마를 CSS보다 먼저 박는다(다크 사용자가 흰 화면을 보지 않게). file://에서는 localStorage가 던질 수 있어 try/catch -->
<script>try{var t=JSON.parse(localStorage.getItem('hymn.prefs')||'{}').theme;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}</script>
<style>
/* 토큰만 쓴다(리터럴 색·px 금지). 팔레트는 악보(종이·잉크) 기준 — song-style의 초록 강조를 쓰지 않는다(사용자 결정 2026-09-04).
   라이트 = 따뜻한 종이 + 검정 잉크, 다크 = 숯색 종이 + 밝은 잉크. 강조는 잉크로 채운 단색(현재 조·재생 중 두 곳).
   촉감(사용자 지시 "딱딱하지 않게, 클릭 느낌"): 누르면 0.96으로 140ms 축소(emil-design-eng), 시트는 아래에서 220ms 드로어 커브로 진입,
   모든 모션 300ms 이하, hover는 마우스에서만, prefers-reduced-motion이면 이동 모션 제거. */
:root{color-scheme:light;
  --bg:#fbf9f4;--surface:#fffdf8;--line:#d8d2c4;--line-soft:#eae5d9;
  --ink:#1a1917;--ink-dim:#57534a;--ink-faint:#706b61;
  --accent:#1a1917;--accent-soft:rgba(26,25,23,.07);
  --glass:rgba(255,253,248,.86);--glass-panel:rgba(255,253,248,.9);--glass-control:rgba(255,255,255,.34);
  --glass-edge:rgba(26,25,23,.12);--glass-highlight:rgba(255,255,255,.72);--scrim:rgba(26,25,23,.1);
  --shadow-control:0 1px 2px rgba(40,32,16,.08),0 5px 14px rgba(40,32,16,.06);
  --shadow-bar:0 -8px 26px rgba(40,32,16,.09);--shadow-sheet:0 18px 48px rgba(40,32,16,.18),0 3px 10px rgba(40,32,16,.09);
  --shadow-active:0 3px 10px rgba(40,32,16,.16);
  --s-half:2px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;
  --hairline:1px;--focus-line:2px;--double-line:3px;--control:44px;--toolbar-item:44px;--toolbar-control:48px;
  --bar:56px;--screen-max:760px;--icon:20px;--glass-blur:18px;--sheet-wide:21.5rem;--sheet-rise:16px;--scrim-spread:100vmax;
  --fs-ui:16px;--fs:16px;--weight-text:300;--r:10px;--press-scale:.96;--cell-gap:.2em;--bar-gap:.4em;--verse-gap:.6em;--chord-nudge:.02em;--chord-nudge-acc:.06em;--chord-edge-safety:1px;--chord-column-clearance:4px;
  --lyric-anchor:.588em;--lyric-anchor-en:.42em;--volta-fs:.7em;--volta-rise:.8em;--volta-gap:.15em;--repeat-dot-gap:.1em;--chord-tracking:-.025em;--chord-bass-clearance:.12em;
  --flat-tight-start:-.12em;--flat-tight-end:-.07em;--sharp-tight-start:-.05em;--sharp-tight-end:-.07em;
  --motion-press:140ms;--motion-sheet:220ms;--motion-fade:160ms;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--layer-sheet:2;--layer-bar:3}
[data-theme="dark"]{color-scheme:dark;
  --bg:#151413;--surface:#1c1b19;--line:#3a3733;--line-soft:#282624;
  --ink:#ebe6da;--ink-dim:#b3ada0;--ink-faint:#8a8478;
  --accent:#ebe6da;--accent-soft:rgba(235,230,218,.10);
  --glass:rgba(28,27,25,.82);--glass-panel:rgba(28,27,25,.88);--glass-control:rgba(255,255,255,.045);
  --glass-edge:rgba(235,230,218,.13);--glass-highlight:rgba(255,255,255,.06);--scrim:rgba(0,0,0,.3);
  --shadow-control:0 1px 2px rgba(0,0,0,.32),0 5px 14px rgba(0,0,0,.20);
  --shadow-bar:0 -8px 28px rgba(0,0,0,.30);--shadow-sheet:0 18px 48px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.34);
  --shadow-active:0 3px 12px rgba(0,0,0,.38)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:var(--weight-text) var(--fs-ui)/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
[hidden]{display:none!important}
.screen{max-width:var(--screen-max);margin:0 auto;
  padding:calc(var(--s4) + env(safe-area-inset-top)) calc(var(--s4) + env(safe-area-inset-right))
    calc(var(--bar) + var(--s6) + env(safe-area-inset-bottom)) calc(var(--s4) + env(safe-area-inset-left))}
#song{touch-action:pan-y;padding-bottom:calc(var(--bar) + var(--s3) + env(safe-area-inset-bottom))}   /* 곡 화면은 연락처 문구가 바닥이라 하단 바까지 24→12px(사용자 지시 2026-09-06) */

/* 누를 수 있는 것: 테두리 없이 옅은 잉크 워시, 누르면 살짝 작아진다 */
button{font:inherit;color:var(--ink);background:var(--accent-soft);border:var(--hairline) solid transparent;border-radius:var(--r);
  min-height:var(--control);min-width:var(--control);padding:0 var(--s3);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform var(--motion-press) var(--ease-out),background-color var(--motion-press) ease,color var(--motion-press) ease}
button:active{transform:scale(var(--press-scale))}
button:disabled{color:var(--ink-faint);background:transparent;cursor:default;transform:none}
@media (hover:hover) and (pointer:fine){
  button:not(:disabled):not(.on):hover{background:var(--accent-soft)}
  #songs .song-open:hover .k{color:var(--ink-dim)}
}
:focus-visible{outline:var(--focus-line) solid var(--accent);outline-offset:var(--focus-line)}

input[type=search]{flex:1;min-width:0;font:inherit;min-height:var(--control);padding:0 var(--s4);border:var(--hairline) solid transparent;border-radius:var(--r);
  background:var(--accent-soft);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=search]::placeholder{color:var(--ink-dim)}
.top{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,var(--control));align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.top input,.top button{background:var(--glass-control);border-color:var(--glass-edge);box-shadow:var(--shadow-control)}
.filter-favorites{color:var(--ink-dim)}
.filter-favorites[aria-pressed="true"]{color:var(--ink)}
.filter-favorites[aria-pressed="true"] svg{fill:currentColor}
#songs{list-style:none;margin:0;padding:0}
#songs .song-row{display:flex;align-items:center;border-bottom:var(--hairline) solid var(--line-soft);margin:0 calc(-1 * var(--s2))}
#songs .song-open{display:flex;align-items:center;flex:1;min-width:0;width:auto;gap:var(--s3);text-align:left;background:none;
  border:0;border-radius:0;padding:var(--s3) var(--s2);margin:0}
#songs .song-open:active{transform:none;background:var(--accent-soft)}   /* 긴 행은 축소 대신 워시로 반응 */
#songs .song-open:active .k{color:var(--ink-dim)}
#songs .favorite{flex:0 0 var(--control)}
#songs .n{color:var(--ink-dim);width:2.6em;flex:none;font-variant-numeric:tabular-nums}
#songs .t{flex:1;min-width:0}
#songs .k{color:var(--ink-faint);flex:none;font-size:.85em}

.head{margin-bottom:var(--s2)}
.head-title{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s1)}
.head h1{flex:1;min-width:0;font-size:1.5em;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.25}
.head-title .favorite{flex:none;margin-block-start:calc(-1 * var(--s2))}
.head p{margin:0;color:var(--ink-dim);font-size:.95em}
#body{font-size:var(--fs)}
section{padding:var(--s4) 0;border-top:var(--hairline) solid var(--line)}   /* 절·후렴 사이 구분선(연주용이라 반드시 보인다) */
section h2{font-size:.8em;font-weight:var(--weight-text);color:var(--ink-dim);margin:0 0 var(--s2);letter-spacing:.02em}
/* 보표 = 표. 세그먼트(코드 하나 + 그 아래 가사) = 열. 열 폭은 표가 행들 중 최대로 맞춘다 → 쌓기에서도 코드가 정확히 그 음절 위. */
.sys{margin:0 0 var(--s3);overflow-x:auto}     /* 곡 단위 비율 축소가 바닥(10px) 아래면 이 상자만 가로 스크롤 */
.sys table{border-collapse:collapse;white-space:nowrap;line-height:1.35}
.sys td{--chord-column-inset:0px;padding:0 var(--cell-gap);padding-left:calc(var(--cell-gap) + var(--chord-column-inset));vertical-align:baseline}
.sys td.b{border-left:var(--hairline) solid var(--line);padding-left:calc(var(--bar-gap) + var(--chord-column-inset))}
.sys td.b0{border-left:0;padding-left:var(--chord-column-inset)}            /* 첫 마디(못갖춘마디 포함) 왼쪽엔 선 없음 */
.sys td.e{border-right:var(--hairline) solid var(--line);padding-right:var(--bar-gap)}
.sys td.e2{border-right:var(--double-line) double var(--line);padding-right:var(--bar-gap)}      /* 곡 끝 겹세로줄 */
/* 도돌이표(2026-09-07): 겹세로줄 + 첫 가사 행 높이의 점 두 개(`:`). rs는 b0(첫 마디, 선 없음)보다 뒤에 두어 이긴다. */
.sys td{position:relative}
.sys td.rs{border-left:var(--double-line) double var(--line);padding-left:calc(var(--bar-gap) + var(--chord-column-inset))}
.sys td.re{border-right:var(--double-line) double var(--line);padding-right:var(--bar-gap)}
.sys tr.ch + tr.ly td.rs::before,.sys tr.ch + tr.ly td.re::after{content:":";position:absolute;top:0;color:var(--ink-dim);line-height:inherit}
.sys tr.ch + tr.ly td.rs::before{left:var(--repeat-dot-gap)}
.sys tr.ch + tr.ly td.re::after{right:var(--repeat-dot-gap)}
/* 볼타 괄호: 코드 행 위 가는 선(vb), 첫 셀에 세로 꼬리 + 번호(v). 번호 자리만큼 코드 행을 띄워 코드 글자와 겹치지 않는다. */
.sys tr.ch td.vb{border-top:var(--hairline) solid var(--ink-dim);padding-top:calc(.5em + var(--volta-rise))}
.sys tr.ch td.v::before{content:attr(data-v) ".";position:absolute;top:0;left:var(--volta-gap);font-size:var(--volta-fs);line-height:1.2;color:var(--ink-dim);
  border-left:var(--hairline) solid var(--ink-dim);padding-left:var(--volta-gap);letter-spacing:0}
.sys tr.ch td{font-size:.85em;font-weight:var(--weight-text);padding-top:.5em;line-height:1.1}
.sys tr.ly td{padding-bottom:.1em}
.chord-main{display:inline-block;position:relative;letter-spacing:var(--chord-tracking);transform:translateX(calc(var(--lyric-anchor) - 50% + var(--chord-nudge)))}
.sys.en .chord-main,.sys.english-part .chord-main{transform:translateX(calc(var(--lyric-anchor-en) - 50% + var(--chord-nudge)))}
.chord-main:has(.accidental){--chord-nudge:var(--chord-nudge-acc)}   /* ♭·♯ 글리프 여백 보정을 상쇄하는 밀림은 임시표 코드에만(기본 코드는 정중앙. 사용자 지적 2026-09-05) */
.chord-bass{position:absolute;left:100%;top:0;white-space:nowrap}
.chord-bass-space{visibility:hidden;letter-spacing:var(--chord-tracking);margin-inline-end:var(--chord-bass-clearance)}
.accidental{display:inline-block}
.accidental.flat{margin-inline:var(--flat-tight-start) var(--flat-tight-end)}
.accidental.sharp{margin-inline:var(--sharp-tight-start) var(--sharp-tight-end)}
.sys td.vn{color:var(--ink-dim);font-size:.8em;padding:0 var(--verse-gap) 0 0;border:0;text-align:right;font-variant-numeric:tabular-nums}
.sys td.vn:empty{padding:0}
.txt{white-space:pre-line;margin:0}
.contact{margin-top:var(--s6);padding-top:var(--s3);border-top:var(--hairline) solid var(--line-soft);color:var(--ink-faint);font-size:.625em;text-align:center}   /* 10px·가운데·밑줄 없이 따옴표만: 사용자 지시 2026-09-06("있을 듯 말 듯") */
.contact a{color:var(--ink-dim);display:inline-block;padding-block:var(--s4);margin-block:calc(-1 * var(--s4));   /* 10px 글자(줄 15px) + 상하 16px = 47px 히트 영역, 보이는 높이는 그대로 */
  text-decoration:none}

/* 하단 툴바: 반투명 유리 + 헤어라인. 버튼 = 아이콘(22px) 위, 한글 라벨 아래(아이폰 탭바). 누르면 워시, 켜진 것은 잉크 채움 */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:var(--s1);align-items:stretch;justify-content:center;
  padding:var(--s1) var(--s2) calc(var(--s1) + env(safe-area-inset-bottom));
  background:var(--glass);-webkit-backdrop-filter:saturate(1.35) blur(var(--glass-blur));backdrop-filter:saturate(1.35) blur(var(--glass-blur));
  border-top:var(--hairline) solid var(--glass-edge);box-shadow:var(--shadow-bar),inset 0 var(--hairline) 0 var(--glass-highlight);z-index:var(--layer-bar)}
#bar button{background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-half);
  flex:0 0 var(--toolbar-item);width:var(--toolbar-item);min-width:var(--toolbar-item);min-height:var(--toolbar-control);padding:0 var(--s1);color:var(--ink-dim);border-radius:var(--r)}
#bar button:not(.on):active{background:var(--accent-soft)}
#play.on{background:var(--ink);color:var(--bg);box-shadow:var(--shadow-active)}
#stackbtn.on{background:var(--accent-soft);color:var(--ink)}
#bar button:disabled{color:var(--ink-faint)}
#bar .l{font-size:.66rem;line-height:1;letter-spacing:.01em;white-space:nowrap}
#bar .t{font-size:1.05rem;font-weight:500;line-height:var(--icon);font-variant-numeric:tabular-nums}
svg{width:var(--icon);height:var(--icon);flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.favorite{display:grid;place-items:center;padding:0;background:none;color:var(--ink-dim);line-height:0}
.favorite.is-favorite{color:var(--ink);background:transparent}
.favorite.is-favorite svg{fill:currentColor}
button.ic{display:grid;place-items:center;padding:0} /* inline SVG의 baseline 오차 없이 44px 정중앙 */
@media (max-width:347px){#bar{gap:0;padding-inline:var(--s-half)}}

/* 조 선택 팝오버: 작은 4×3 글래스 그리드. 360px 미만만 3열로 바꿔 긴 조 이름과 44px 터치를 지킨다. */
.panel{position:fixed;left:50%;right:auto;bottom:calc(var(--bar) + var(--s3) + env(safe-area-inset-bottom));
  width:min(calc(100vw - var(--s4) - var(--s4)),var(--sheet-wide));transform:translateX(-50%);
  background:var(--glass-panel);-webkit-backdrop-filter:saturate(1.35) blur(var(--glass-blur));backdrop-filter:saturate(1.35) blur(var(--glass-blur));
  border:var(--hairline) solid var(--glass-edge);border-radius:calc(var(--r) + var(--s2));padding:var(--s2);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s1);max-height:calc(100vh - var(--bar) - var(--s6));overflow-x:hidden;overflow-y:auto;
  box-shadow:var(--shadow-sheet),0 0 0 var(--scrim-spread) var(--scrim),inset 0 var(--hairline) 0 var(--glass-highlight);translate:0 0;opacity:1;z-index:var(--layer-sheet);
  transition:translate var(--motion-sheet) var(--ease-drawer),opacity var(--motion-fade) var(--ease-out)}
@starting-style{.panel{translate:0 var(--sheet-rise);opacity:0}}
@media (max-width:359px){.panel{grid-template-columns:repeat(3,minmax(0,1fr))}}
.panel button{position:relative;background:var(--glass-control);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;
  min-width:0;text-align:center;padding:0 var(--s-half);font-size:.875rem;font-weight:var(--weight-text);line-height:1.1;letter-spacing:-.01em;white-space:nowrap;box-shadow:none}
.panel button:active{background:var(--accent-soft)}
.panel button:focus-visible{z-index:1}
.panel button.on{background:var(--ink);color:var(--bg);box-shadow:var(--shadow-active)}
.panel .o{position:absolute;right:var(--s1);bottom:var(--s-half);color:var(--ink-dim);font-size:.62rem;font-weight:400;line-height:1;letter-spacing:0}
.panel .o:empty{display:none}
.panel button.on .o{color:var(--bg)}

@media (prefers-reduced-motion:reduce){
  button,#songs button,.panel{transition-duration:0ms}
  button:active{transform:none}
}
</style>
</head>
<body>
<!-- 아이콘은 전부 인라인 SVG(24 그리드, 1.8 선). 글자 기호(◐ ▶)는 기기마다 글꼴이 달라 쓰지 않는다 -->
<svg hidden>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.53 5.12 5.65.82-4.09 3.99.97 5.63L12 16.7l-5.06 2.66.97-5.63-4.09-3.99 5.65-.82z"/></symbol>
</svg>
<main id="list" class="screen">
  <header class="top">
    <input id="q" type="search" placeholder="번호·제목 검색" aria-label="곡 검색" autocomplete="off">
    <button id="favorite-filter" class="filter-favorites ic" type="button" aria-label="즐겨찾기만 보기" aria-pressed="false" aria-controls="songs"><svg aria-hidden="true" focusable="false"><use href="#i-star"/></svg></button>
    <button class="theme ic" aria-label="어두운 테마로 전환" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-theme"/></svg></button>
  </header>
  <ul id="songs"></ul>
</main>
<main id="song" class="screen" hidden>
  <header class="head">
    <div class="head-title">
      <h1 id="title" tabindex="-1"></h1>
      <button id="favbtn" class="favorite ic" type="button" aria-label="즐겨찾기에 추가" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-star"/></svg></button>
    </div>
    <p id="sub"></p><p id="meta"></p>
  </header>
  <div id="body"></div>
  <!-- 곡 하단 연락처: 흐린 잉크·작은 글자로 "있는 듯 말 듯". 링크만 밑줄(1px 반투명). 히트 영역은 패딩으로 44px 확보 -->
  <footer class="contact">문의 사항은 <a href="https://open.kakao.com/o/sQcWBeMi" target="_blank" rel="noopener">"여기"</a>로 보내주세요.</footer>
  <div id="keys" class="panel" role="group" aria-label="조 선택" hidden></div>
</main>
<!-- 하단 툴바: 아이콘 + 한글 라벨 7칸(390px 폭에 맞춤). 자동 스크롤 중에는 작게/크게 자리에 느리게/빠르게가 들어온다 -->

":[],"text":"Jesus Lord, I'm captured by Thy beauty,\nAll my heart to Thee I open wide;\nNow set free from all religious duty,\nOnly let me in Thyself abide.\nAs I'm gazing here upon Thy glory,\nFill my heart with radiancy divine;\nSaturate me, Lord, I now implore Thee,\nMingle now Thy Spirit, Lord, with mine.","piece":0},{"label":"2절(영문)","kind":"verse","num":2,"lang":"en","systems":[],"text":"Shining One—how clear the sky above me!\nSon of Man, I see Thee on the throne!\nHoly One, the flames of God consume me,\nTill my being glows with Thee alone.\nLord, when first I saw Thee in Thy splendor,\nAll self-love and glory sank in shame;\nNow my heart its love and praises render,\nTasting all the sweetness of Thy name.","piece":0},{"label":"3절(영문)","kind":"verse","num":3,"lang":"en","systems":[],"text":"Precious Lord, my flask of alabaster\nGladly now I break in love for Thee;\nI anoint Thy head, Beloved Master;\nLord, behold, I've saved the best for Thee.\nDearest Lord, I waste myself upon Thee;\nLoving Thee, I'm deeply satisfied.\nLove outpoured from hidden depths within me,\nCostly oil, dear Lord, I would provide.","piece":0},{"label":"4절(영문)","kind":"verse","num":4,"lang":"en","systems":[],"text":"My Beloved, come on spices' mountain;\nHow I yearn to see Thee face to face.\nDrink, dear Lord, from my heart's flowing fountain,\nTill I rest fore'er in Thine embrace.\nNot alone, O Lord, do I adore Thee,\nBut with all the saints as Thy dear Bride;\nQuickly come, our love is waiting for Thee;\nJesus Lord, Thou wilt be satisfied.","piece":0}]},{"id":"165","page":165,"title":"주 예수 부를 때면","sub":null,"key":"C","minor":false,"time":"6/8","pickup":true,"bars":19,"notes":[],"sections":[{"label":"1절","kind":"verse","num":1,"lang":"ko","systems":[{"cells":[[{"c":null,"t":"주"}],[{"c":"C","t":"예수 부를"}],[{"c":null,"t":"때면 내 마"}],[{"c":"F","t":"음 타오르"}],[{"c":"C","t":"고"}]],"end":"|"},{"cells":[[{"c":null,"t":"내 안"}],[{"c":"F","t":"에 주 그리"}],[{"c":"C","t":"스도 그"}],[{"c":"D","t":"생명 자라 // 화면 로직. 엔진(engine.js)이 준 모델을 DOM으로 그린다. 데이터 계약: 코드변환기 계획.md §2
// 화면 2개(목록·곡)를 display로만 바꾸고 URL은 #025. 설정은 localStorage 'hymn.prefs' {theme,fontPx,speed}.
(function () {
  'use strict';
  var E = window.Engine, SONGS = window.SONGS || [], SONG_BY_ID = Object.create(null);
  SONGS.forEach(function (song) { SONG_BY_ID[song.id] = song; });
  var $ = function (s) { return document.querySelector(s); };
  var MIN_SCROLL_SPEED = 1, MAX_SCROLL_SPEED = 15;
  var PREF = 'hymn.prefs', FAVORITES_KEY = 'song-of-songs.favorites.v1';
  var prefs = { theme: 'light', fontPx: 16, speed: 3 }, favorites = loadFavorites();
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF) || '{}')); } catch (e) {}
  if (prefs.theme !== 'light' && prefs.theme !== 'dark') prefs.theme = 'light';
  if (typeof prefs.fontPx !== 'number' || !isFinite(prefs.fontPx)) prefs.fontPx = 16;
  prefs.fontPx = Math.min(24, Math.max(12, prefs.fontPx));
  if (typeof prefs.speed !== 'number' || !isFinite(prefs.speed)) prefs.speed = 3;
  prefs.speed = Math.min(MAX_SCROLL_SPEED, Math.max(MIN_SCROLL_SPEED, Math.round(prefs.speed)));
  function save() { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {} }
  function loadFavorites() {
    var saved = [], result = new Set();
    try { saved = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); } catch (e) {}
    if (!Array.isArray(saved)) return result;
    saved.forEach(function (id) { if (typeof id === 'string' && /^\d{3}$/.test(id)) result.add(id); });
    return result;
  }
  function saveFavorites() {
    try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favorites).sort())); return true; } catch (e) { return false; }
  }
  var st = { song: null, offset: 0, stacked: false, playing: false, favoritesOnly: false };
  var returnSongId = null, returnListScrollY = 0, routeFocus = null;
  function el(tag, cls, text) { var d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
  function icon(id) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false'); use.setAttribute('href', id); svg.appendChild(use);
    return svg;
  }
  // 시스템 글꼴의 ♭ 왼쪽 여백이 커서 B ♭처럼 보이는 것을 막는다. 데이터·엔진 문자열은 그대로 두고 표시 글리프만 감싼다.
  function musicText(node, text) {
    node.textContent = '';
    String(text || '').split(/([♯♭])/).forEach(function (part) {
      if (!part) return;
      node.appendChild(part === '♭' || part === '♯' ? el('span', 'accidental ' + (part === '♭' ? 'flat' : 'sharp'), part) : document.createTextNode(part));
    });
    return node;
  }
  // slash 앞의 본 코드만 첫 가사 음절 중심에 놓고, /베이스는 그 오른쪽으로 흘린다.
  function chordText(node, text) {
    var slash = text.indexOf('/'), mainText = slash < 0 ? text : text.slice(0, slash);
    var main = musicText(el('span', 'chord-main'), mainText);
    if (slash >= 0) {
      main.appendChild(musicText(el('span', 'chord-bass'), text.slice(slash)));
      node.appendChild(musicText(el('span', 'chord-bass-space'), text.slice(slash)));
    }
    node.insertBefore(main, node.firstChild);
    return node;
  }

  // ---- 목록
  function setFavoriteButton(button, song) {
    var on = favorites.has(song.id);
    button.dataset.favoriteId = song.id;
    button.classList.toggle('is-favorite', on);
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', (on ? '즐겨찾기에서 제거: ' : '즐겨찾기에 추가: ') + String(+song.id) + '번 ' + song.title);
  }
  function syncFavoriteButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-favorite-id]'), function (button) {
      var song = SONG_BY_ID[button.dataset.favoriteId];
      if (song) setFavoriteButton(button, song);
    });
  }
  function setFavoriteFilterButton() {

  // ---- 가로 자동 맞춤: 비율이 크기보다 중요하다(사용자 지시 2026-09-04). 보표마다 따로 줄이면 줄마다 글자 크기가 달라져
  // 악보의 비율이 깨지므로, 16px 악보가 가장 긴 보표에 맞는 비율을 먼저 구한 뒤 사용자 A−/A+ 비율을 별도로 곱한다.

  // ---- 조 선택: 세로 12버튼, C 맨 위. 원조는 '원조' 표시, 현재 조만 강조.

    b.onclick = function () { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
  });
  $('#favorite-filter').onclick = function () {
    st.favoritesOnly = !st.favoritesOnly; setFavoriteFilterButton(); renderList($('#q').value);
  };
  $('#favbtn').onclick = function () { if (st.song) toggleFavorite(st.song); };
  window.addEventListener('storage', function (e) {
    if (e.key !== FAVORITES_KEY && e.key !== null) return;
    try { if (e.storageArea !== localStorage) return; } catch (error) {}
    favorites = loadFavorites();
    refreshFavoriteResults();
  });

  // ---- 자동 스크롤. 390px의 001·026·112 실측 보표 간격은 53.66·56.94·50.03px(평균 53.54px).
  // 느린 찬송 기준 보표당 약 12초가 되도록 px/s = 1.5×속도: 기본 3은 4.5px/s, 평균 11.90초/보표(2026-09-04 CDP 보정).
  // 소수 절대 좌표를 누적하고, 정수 scrollY 사이의 나머지는 곡 화면 transform으로 보간해 저속에서도 실제 화면이 매 프레임 이어진다.
  // 0.1초 상한은 백그라운드 복귀 급이동을 막는다. 1~15 = 1.5~22.5px/s.
  var SCROLL_PX_PER_SPEED = 1.5, MAX_SCROLL_FRAME_SECONDS = 0.1;
  var raf = null, last = 0, scrollTarget = 0, lock = null, playGeneration = 0;
  function drawScrollPosition() {
    var whole = Math.floor(scrollTarget), fraction = scrollTarget - whole;
    window.scrollTo(0, whole);
    $('#song').style.transform = fraction > 0.001 ? 'translate3d(0,' + (-fraction).toFixed(3) + 'px,0)' : '';
  }
  function step(ts) {
    if (!st.playing) return;
    if (last) {
      var seconds = Math.min((ts - last) / 1000, MAX_SCROLL_FRAME_SECONDS);
      var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      scrollTarget = Math.min(maxScroll, scrollTarget + seconds * prefs.speed * SCROLL_PX_PER_SPEED);
      drawScrollPosition();
    }
    last = ts;
    if (scrollTarget >= document.documentElement.scrollHeight - window.innerHeight - 0.001) return stopScroll();
    raf = requestAnimationFrame(step);
  }
  function requestWake(generation) {
    try {
      if (!navigator.wakeLock || !st.playing || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function (nextLock) {
        nextLock.addEventListener('release', function () { if (lock === nextLock) lock = null; });
        if (!st.playing || generation !== playGeneration || document.visibilityState !== 'visible') {
          nextLock.release().catch(function () {}); return;
        }
        var oldLock = lock; lock = nextLock;
        if (oldLock && oldLock !== nextLock && !oldLock.released) oldLock.release().catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  }
  function startScroll() {
    var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if (window.scrollY >= maxScroll - 0.001) return;
    var generation = ++playGeneration;
    st.playing = true; last = 0; scrollTarget = window.scrollY; $('#song').style.willChange = 'transform';
    $('#play').classList.add('on'); playIcon(true); showSpeed(true);
    raf = requestAnimationFrame(step);
    requestWake(generation);
  }
  function stopScroll() {
    var restorePlayFocus = document.activeElement === $('#sminus') || document.activeElement === $('#splus');
    playGeneration++;
    if (st.playing) {
      st.playing = false; if (raf != null) cancelAnimationFrame(raf); raf = null;
      $('#play').classList.remove('on'); playIcon(false); showSpeed(false);
    }
    if ($('#song').style.transform) window.scrollTo(0, Math.round(scrollTarget));
    $('#song').style.transform = ''; $('#song').style.willChange = '';
    if (lock) { lock.release().catch(function () {}); lock = null; }
    if (restorePlayFocus) $('#play').focus({ preventScroll: true });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && st.playing) { last = 0; requestWake(playGeneration); }
  });
  function playIcon(on) {
    var play = $('#ic-play'), stop = $('#ic-stop');
    if (on) { play.setAttribute('hidden', ''); stop.removeAttribute('hidden'); }
    else { play.removeAttribute('hidden'); stop.setAttribute('hidden', ''); }
    $('#play-l').textContent = on ? '정지' : '재생';
    $('#play').setAttribute('aria-pressed', String(on));
    $('#play').setAttribute('aria-label', on ? '자동 스크롤 정지' : '자동 스크롤 재생');
  }
  function showSpeed(on) {
    ['#sminus', '#splus'].forEach(function (s) { $(s).hidden = !on; });
    ['#fminus', '#fplus'].forEach(function (s) { $(s).hidden = on; });
    $('#play-l').textContent = on ? '정지 ' + prefs.speed : '재생';        // 44px 칸 안에서 현재 속도를 짧게 표시한다.
    $('#sminus').disabled = prefs.speed <= MIN_SCROLL_SPEED; $('#splus').disabled = prefs.speed >= MAX_SCROLL_SPEED;
    $('#sminus').setAttribute('aria-label', '속도 낮추기, 현재 ' + prefs.speed);
    $('#splus').setAttribute('aria-label', '속도 높이기, 현재 ' + prefs.speed);
  }
  $('#play').onclick = function () { if (st.playing) stopScroll(); else startScroll(); };
  $('#sminus').onclick = function () { prefs.speed = Math.max(MIN_SCROLL_SPEED, prefs.speed - 1); save(); showSpeed(true); };
  $('#splus').onclick = function () { prefs.speed = Math.min(MAX_SCROLL_SPEED, prefs.speed + 1); save(); showSpeed(true); };
  // 두 손가락 확대는 본문 글자 비율로 바꾸고 손을 뗀 크기를 저장한다. 툴바는 main 밖이라 확대되지 않는다.
  var pinch = null, pinchFrame = null, pendingFont = prefs.fontPx;
  function touchDistance(touches) {
    var x = touches[0].clientX - touches[1].clientX, y = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(x * x + y * y);
  }
  function drawPinch() { pinchFrame = null; setFont(pendingFont, false, false); }
  $('#song').addEventListener('touchstart', function (e) {
    stopScroll();
    if (e.touches.length === 2) {
      var distance = touchDistance(e.touches);
      if (distance < 1) return;
      e.preventDefault();
      pinch = { distance: distance, font: prefs.fontPx };
    }
  }, { passive: false });
  $('#song').addEventListener('touchmove', function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault(); pendingFont = pinch.font * touchDistance(e.touches) / pinch.distance;
    if (pinchFrame == null) pinchFrame = requestAnimationFrame(drawPinch);
  }, { passive: false });
  function finishPinch(e) {
    if (!pinch || e.touches.length >= 2) return;
    if (pinchFrame != null) { cancelAnimationFrame(pinchFrame); drawPinch(); }
    pinch = null; prefs.fontPx = Math.round(prefs.fontPx * 100) / 100; save();
    if (st.song) renderSong();
  }
  $('#song').addEventListener('touchend', finishPinch, { passive: true });
  $('#song').addEventListener('touchcancel', finishPinch, { passive: true });
  window.addEventListener('wheel', stopScroll, { passive: true });

  $('#q').oninput = function () { renderList(this.value); };
  window.addEventListener('hashchange', route);
  applyTheme(); setFavoriteFilterButton(); renderList(''); showSpeed(false); route();
})();
</script>
</body>
</html>
