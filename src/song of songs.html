<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song of Songs</title>
<!-- 저장된 테마를 CSS보다 먼저 박는다(다크 사용자가 흰 화면을 보지 않게). file://에서는 localStorage가 던질 수 있어 try/catch -->
<script>try{var t=JSON.parse(localStorage.getItem('hymn.prefs')||'{}').theme;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 아이콘은 전부 인라인 SVG(24 그리드, 1.8 선). 글자 기호(◐ ▶)는 기기마다 글꼴이 달라 쓰지 않는다 -->
<svg hidden>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.53 5.12 5.65.82-4.09 3.99.97 5.63L12 16.7l-5.06 2.66.97-5.63-4.09-3.99 5.65-.82z"/></symbol>
</svg>
<main id="list" class="screen">
  <header class="top">
    <input id="q" type="search" placeholder="번호·제목 검색" aria-label="곡 검색" autocomplete="off">
    <button id="favorite-filter" class="filter-favorites ic" type="button" aria-label="즐겨찾기만 보기" aria-pressed="false" aria-controls="songs"><svg aria-hidden="true" focusable="false"><use href="#i-star"/></svg></button>
    <button class="theme ic" aria-label="어두운 테마로 전환" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-theme"/></svg></button>
  </header>
  <ul id="songs"></ul>
</main>
<main id="song" class="screen" hidden>
  <header class="head">
    <div class="head-title">
      <h1 id="title" tabindex="-1"></h1>
      <button id="favbtn" class="favorite ic" type="button" aria-label="즐겨찾기에 추가" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-star"/></svg></button>
    </div>
    <p id="sub"></p><p id="meta"></p>
  </header>
  <div id="body"></div>
  <div id="keys" class="panel" role="group" aria-label="조 선택" hidden></div>
</main>
<!-- 하단 툴바: 아이콘 + 한글 라벨 6칸(자동 스크롤은 본문 두 번 탭·더블클릭·Space, 버튼 없음)(390px 폭에 맞춤). 자동 스크롤 중에는 작게/크게 자리에 느리게/빠르게가 들어온다 -->
<nav id="bar" aria-label="곡 도구" hidden>
  <button id="back" aria-label="목록으로"><svg aria-hidden="true" focusable="false"><use href="#i-back"/></svg><span class="l">목록</span></button>
  <button id="keybtn" aria-label="조 선택" aria-controls="keys" aria-expanded="false"><b id="keyname" class="t"></b><span class="l">조</span></button>
  <button id="stackbtn" aria-label="절 쌓기 보기" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-stack"/></svg><span class="l">절</span></button>
  <button id="fminus" aria-label="글자 작게"><b class="t">A−</b><span class="l">작게</span></button>
  <button id="fplus" aria-label="글자 크게"><b class="t">A+</b><span class="l">크게</span></button>
  <button id="sminus" aria-label="느리게" hidden><b class="t">−</b><span class="l">느리게</span></button>
  <button id="splus" aria-label="빠르게" hidden><b class="t">+</b><span class="l">빠르게</span></button>
  <button class="theme" aria-label="어두운 테마로 전환" aria-pressed="false"><svg aria-hidden="true" focusable="false"><use href="#i-theme"/></svg><span class="l">테마</span></button>
</nav>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
